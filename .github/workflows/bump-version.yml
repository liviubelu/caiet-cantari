name: Bump patch version

# Runs on every push to master, EXCEPT commits made by this workflow itself
# (detected via the "[auto]" marker in the commit message).
on:
  push:
    branches: [master]

jobs:
  bump:
    # Skip if the commit was produced by the version-bump action
    if: "!contains(github.event.head_commit.message, '[auto]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN — has write access to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bump patch version
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore: bump to v${VERSION} [auto]"
          git push
